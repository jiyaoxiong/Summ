name: Build Yuejing AI v0.3.1 APK

on:
  push:
    branches: [yuejing-v031-build]
    paths:
      - 'ci/yuejing-v031/**'
      - '.github/workflows/yuejing-v031-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Decode source
        shell: bash
        run: |
          set -euxo pipefail
          cat ci/yuejing-v031/part*.txt > /tmp/yuejing-v031.b64
          base64 -d /tmp/yuejing-v031.b64 > /tmp/yuejing-v031.zip
          unzip -t /tmp/yuejing-v031.zip
          mkdir -p /tmp/yuejing
          unzip -q /tmp/yuejing-v031.zip -d /tmp/yuejing
          test -f /tmp/yuejing/YuejingAIService-v0.3.1/android/settings.gradle.kts
      - name: Bootstrap sherpa
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/yuejing/YuejingAIService-v0.3.1
          chmod +x tools/bootstrap_sherpa.sh
          ./tools/bootstrap_sherpa.sh
      - name: Build APK
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/yuejing/YuejingAIService-v0.3.1/android
          gradle --no-daemon clean :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/YuejingAI-v0.3.1.apk"
          ls -lh "$GITHUB_WORKSPACE/YuejingAI-v0.3.1.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: YuejingAI-v0.3.1-apk
          path: YuejingAI-v0.3.1.apk
          if-no-files-found: error
          retention-days: 7
